name: ModuleTester

options:
  bundleIdPrefix: com.mxfia19
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    SUPPORTS_MACCATALYST: NO

targets:
  ModuleTester:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources

    info:
      path: Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.ModuleTester
        PRODUCT_NAME: ModuleTester
        SWIFT_VERSION: 5.9
        # Utiliser NOTRE Info.plist verbatim (sinon Xcode 16 en génère un et
        # écrase la clé launch screen → bandes noires).
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""
        DEVELOPMENT_TEAM: ""
