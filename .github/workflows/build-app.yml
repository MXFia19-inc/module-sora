name: Build ModuleTester (app)

on:
  push:
    branches:
      - main
      - claude/ios-modular-app-2i7yt7
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

jobs:
  # Smoke test du contrat des modules (informatif : dépend de la disponibilité des sites).
  contract-smoke:
    name: Smoke test des modules
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier le contrat des modules
        run: node app/tools/smoke.mjs --all "one piece"

  build-ios:
    name: Build iOS IPA (non signé)
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Variables de release
        id: vars
        run: |
          # Version sémantique "à retenue" : le patch va de 0 à 9 puis passe au
          # minor (ex. run 9 → 1.0.9, run 10 → 1.1.0, run 100 → 2.0.0).
          N=${{ github.run_number }}
          MAJOR=$((1 + N / 100))
          MINOR=$(((N / 10) % 10))
          PATCH=$((N % 10))
          echo "version=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
          echo "tag=app-nightly-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Injecter la version dans project.yml
        run: |
          sed -i '' "s/PRODUCT_NAME: ModuleTester/PRODUCT_NAME: ModuleTester\n        MARKETING_VERSION: ${{ steps.vars.outputs.version }}\n        CURRENT_PROJECT_VERSION: ${{ github.run_number }}/g" project.yml

      - name: Générer le projet Xcode
        run: xcodegen generate --spec project.yml

      - name: Post-Generation Fix (Anti-Black Bars, Version & PiP)
        run: |
          # Identique au bloc éprouvé de TwitchUnblock : patch de TOUS les Info.plist.
          find . -name "Info.plist" -exec plutil -replace CFBundleShortVersionString -string "${{ steps.vars.outputs.version }}" {} \;
          find . -name "Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \;

          # Force le plein écran sans bandes noires
          find . -name "Info.plist" -exec plutil -remove UILaunchStoryboardName {} \; || true
          find . -name "Info.plist" -exec plutil -replace UILaunchScreen -xml "<dict/>" {} \;

          # PiP / audio en arrière-plan
          find . -name "Info.plist" -exec plutil -replace UIBackgroundModes -json '["audio"]' {} \;

          # ATS : autorise l'HTTP en clair (les modules visent des hébergeurs http://)
          find . -name "Info.plist" -exec plutil -replace NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads": true}' {} \;

      - name: Build IPA
        run: |
          chmod +x ./buildipa.sh
          ./buildipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModuleTester-IPA
          path: app/build/ModuleTester.ipa

      - name: Créer la release nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" build/ModuleTester.ipa \
            --title "ModuleTester ${{ steps.vars.outputs.version }}" \
            --notes "Build automatique le ${{ steps.vars.outputs.date }} (app de test des modules)."
